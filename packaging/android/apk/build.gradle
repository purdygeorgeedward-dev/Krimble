buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

ext {
    abi = System.getenv('ANDROID_ABI') ?: project.ext.properties['abi']
    ndkpath = System.getenv('KDECI_ANDROID_NDK_ROOT') ?: project.ext.properties['ndk.dir']  // TODO: Newer versions of Qt do support this dir
    installPrefix = System.getenv('KRITA_INSTALL_PREFIX')

    // Note about qtResPath vs qt5AndroidDir:
    //
    // qt5AndroidDir is set up by androiddeployqt and points to exact files
    // in _install directory, which is not available on the builder that builds
    // AppBundle packages, so we should access these files from a manually copied
    // location.
    //
    // tldr; at one time, either qt5AndroidDir or qtResPath is valid and points
    //       to the same files
    qtResPath = System.getenv('KRITA_BUILD_APPBUNDLE') ? 'extra-bundle-deps/android/java' : ""
}

tasks.register('configure') {
    doLast {
        if (abi == null && !project.hasProperty("abi")) {
            logger.error('ANDROID_ABI not specified using the default one instead: arm64-v8a')
            abi = 'arm64-v8a'
        }

        def libs = new File(installPrefix, 'lib')
        if (!libs.exists()) {
            throw new FileNotFoundException('Krita libraries not found, please check if -p=krita-bin finished without errors')
        }
    }
}

tasks.register('writeConfig', WriteProperties) {
    dependsOn('configure')
    outputFile = file("gradle.properties")
    def gradleProperties = new Properties()
    outputFile.withInputStream { gradleProperties.load(it) }

    properties gradleProperties
    property 'abi', abi
    property 'ndk.dir', ndkpath
}

// copy libs(plugins) which start with krita*.so and rename
// them to start with `lib_`
tasks.register('copyLibs', Copy) {
    dependsOn('configure')
    from "$installPrefix/lib"
    into "libs/$abi"
    exclude "mlt-7/**"
    rename('^krita(.*).so$', 'lib_krita$1.so')
}

// copy MLT plugins and rename
// them to start with `lib_`
tasks.register('copyMltPlugins', Copy) {
    dependsOn('configure', 'copyLibs')
    from "$installPrefix/lib/mlt-7"
    into "libs/$abi"
    rename('^libmlt(.*).so$', 'lib_mltplugin_$1.so')
}

tasks.register('copySDLJar', Copy) {
    dependsOn('configure')
    from "$installPrefix/jar"
    into 'libs/'
    include 'SDL2Android.jar'
}

tasks.register('copyFonts', Copy) {
    dependsOn('configure')
    from "$installPrefix/etc"
    into 'assets/etc/'
    include '**'
}

/*
 * androiddeployqt doesn't fully copy the directories. Hidden directories
 * to be specific. That's why we copy manually and then delete the partial
 * one it creates
 */
tasks.register('copyAssets', Copy) {
    dependsOn('configure')
    from "$installPrefix/share/"
    into 'assets/'
    include '**'
}

tasks.register('copyLocaleFiles', Copy) {
    dependsOn('configure', 'copyAssets')
    from "$installPrefix/share/locale"
    from "$installPrefix/translations"
    into 'assets/locale/'
    include '**'
}

tasks.register('copyExtraMltFiles', Copy) {
    dependsOn('configure', 'copyAssets')
    from "$installPrefix/share/mlt-7"
    into 'assets/mlt-7'
    include '**'
}

/*
 * Remove "share" folder in assets. It is copied both manually and by
 * androiddeployqt(reason in copyAssets task).
 */
tasks.register('removeDuplicateAssets', Delete) {
    dependsOn('configure', 'copyFonts', 'copyAssets', 'copyLocaleFiles', 'copyExtraMltFiles')
    delete "assets/share"
}

def isPackagingAPK() {
    return gradle.taskGraph.hasTask(assembleRelease) || gradle.taskGraph.hasTask(assembleDebug)
}

android {
    /**
     * We store the application ID in both, `namespace` tag and in the
     * `package` attribute in the manifest, because androiddeployqt from Qt 5.15.x
     * does not know how to fetch the package name from the Manifest
     */
    namespace = "org.krimble"

    // AGP 8.x requires compileSdk set directly under android{}, not
    // nested inside defaultConfig{} (where it used to live under much
    // older AGP versions). It silently has no effect there under 8.x,
    // which is why AGP reports it as unset even though a line existed.
    // androidCompileSdkVersion was never actually defined anywhere in
    // this repo, in any properties file, or passed by the real CI
    // script (build-tools/ci-scripts/android.yml calls plain
    // `./gradlew assembleRelease`, no extra properties). It silently
    // never got evaluated before this fix (wrong location meant AGP
    // never read it) - now that it's in the right spot, hardcoded to
    // match the targetSdkVersion already hardcoded below (35).
    compileSdk 35

    ndkPath ndkpath

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qt5AndroidDir + '/src', qtResPath + '/src', 'src', 'java']
            aidl.srcDirs = [qt5AndroidDir + '/src', qtResPath + '/src', 'src', 'aidl']
            res.srcDirs = [qt5AndroidDir + '/res',  qtResPath + '/res', 'res']
            resources.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs', 'lib']
        }
        nightly {
            manifest.srcFile 'flavors/next/AndroidManifest.xml'
        }
        debug {
            manifest.srcFile 'flavors/debug/AndroidManifest.xml'
        }
    }

    signingConfigs {
        release {
            // Keystore lives outside the repo (in $HOME on the build
            // machine); passwords come from env vars set on that machine's
            // shell profile, never committed here. If either env var is
            // unset (e.g. a plain debug/dev build), this silently falls
            // back to no signing config rather than failing the build -
            // only assembleRelease actually needs these set.
            def ksPassword = System.getenv("KRIMBLE_KEYSTORE_PASSWORD")
            def keyPass = System.getenv("KRIMBLE_KEY_PASSWORD")
            if (ksPassword != null && keyPass != null) {
                // file("${...}/...") with an interpolated GString hits a
                // known Groovy ambiguity ("Ambiguous method overloading
                // for method java.io.File#<init>"). An explicit two-arg
                // File(parent, child) constructor looked like the fix,
                // but hit the exact same ambiguity again - the real
                // cause is that System.getenv('HOME') returns null in
                // whatever context Gradle actually runs in here
                // (daemon/SSH environments don't always inherit shell
                // env vars the way a plain shell does), and a null
                // first argument to File(x, String) is inherently
                // ambiguous between File(String,String) and
                // File(File,String) regardless of constructor style.
                // Using Java's user.home system property instead, which
                // Gradle always populates correctly.
                storeFile new File(System.properties['user.home'] as String, 'krimble-release.jks')
                storePassword ksPassword
                keyAlias "krimble"
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        nightly {
            initWith release
            applicationIdSuffix ".next"
        }
        debug {
            // Comment this out when testing in-app purchases. The package name
            // must not have a suffix for those to work properly.
            applicationIdSuffix ".debug"
        }
    }

    project.ext.constant = 5

    def versionMajor    = 5
    def versionMinor    = 4

    /**
     * This version does **not** correspond to the patch version
     * of Krita. Instead, it is just incremented for every public
     * (including alpha and beta) release of versionMajor.versionMinor
     * branch
     */
    // Krimble 2026-10-09: George sets the version by hand. Change this ONE number for each release build. It gives
    // versionName 1.0.<number>-beta and the last two digits of the version code (5050400 + number).
    // Google Play needs a higher number for every upload.
    // def krimbleBuildNumber = 30   (2026-10-10)
    // def krimbleBuildNumber = 31   (2026-10-11)
    // def krimbleBuildNumber = 32   (2026-10-12)
    // def krimbleBuildNumber = 33   (2026-10-12)
    // def krimbleBuildNumber = 34   (2026-10-12)
    // def krimbleBuildNumber = 35   (2026-10-13)
    // def krimbleBuildNumber = 36   (2026-10-13)
    // def krimbleBuildNumber = 37   (2026-10-15 to 2026-10-17)
    // def krimbleBuildNumber = 38   (2026-10-17 to 2026-10-18)
    def krimbleBuildNumber = 39
    // (counter-file reading, replaced by the hand-set number above)
    // def krimbleBuildNumber = 0
    // try {
    //     def counterFile = new File(System.properties['user.home'] as String, 'krimble-build-number.txt')
    //     if (counterFile.exists()) {
    //         def counterText = counterFile.text.trim()
    //         if (counterText ==~ /^[0-9]+$/) { krimbleBuildNumber = counterText.toInteger() }
    //     }
    // } catch (Exception e) { }
    // Krimble 2026-10-09: was 0. Version code 5050400 was already used on Google Play; 1 gives 5050401.
    // def versionRelease  = 0
    // def versionRelease  = 1
    // def versionRelease  = krimbleBuildNumber > 0 ? krimbleBuildNumber : 1
    def versionRelease  = krimbleBuildNumber

    defaultConfig {
        // compileSdk moved to the top of the android{} block above -
        // AGP 8.x requires it there, this location was silently a no-op

        // even though buildToolsVersion is deprecated,
        // we should still explicitly state it. Otherwise,
        // AGP will use the default one
        buildToolsVersion "35.0.0"

        // Matches the NDK actually present on the build server (r22b) -
        // was hardcoded to 27.3.13750724, a version that was never
        // installed here, which made AGP fail to strip every native
        // library and fail the final packaging step entirely.
        // Krimble 2026-10-09: was "22.1.7171670". The server builds on 2026-10-08 (which stripped native libraries successfully) used 27.3.13750724. The comment above is outdated.
        // ndkVersion "22.1.7171670"
        ndkVersion "27.3.13750724"

        // Krimble 2026-10-09: was 35. Google Play requires API 36. Built and accepted by Play on 2026-10-08 via server-side sed.
        // targetSdkVersion 35
        targetSdkVersion 36
        minSdkVersion 24
        versionCode project.ext.constant * 1000000 + versionMajor * 10000 + versionMinor * 100 + versionRelease
        // Krimble 2026-10-09: was "1.0.0-beta2". Now matches the 1.0.29-beta release published 2026-10-07 (asset krimble-arm64-v8a-1.0.29-beta-release.apk).
        // versionName "1.0.0-beta2"
        // versionName "1.0.29-beta"
        // versionName krimbleBuildNumber > 0 ? "1.0.${krimbleBuildNumber}-beta" : "1.0.29-beta"
        versionName "1.0.${krimbleBuildNumber}-beta"
        def unstableSuffix = System.getenv('KRITA_UNSTABLE_PACKAGE_SUFFIX')
        archivesBaseName = System.getenv('KRITA_BUILD_APPBUNDLE') ? "krimble-$versionName$unstableSuffix" : "krimble-$abi-$versionName$unstableSuffix"
    }
    buildFeatures {
        renderScript true
        aidl true
    }

    // This is needed because, gradle by default ignores hidden assets.
    androidResources {
        ignoreAssetsPattern '!.foajasoie'
    }

    lint {
        abortOnError false
    }


    configure.onlyIf { isPackagingAPK() }
    configure.finalizedBy(writeConfig)
    configure.finalizedBy(copyLibs)
    configure.finalizedBy(copyMltPlugins)
    configure.finalizedBy(copyFonts)
    configure.finalizedBy(copyAssets)
    configure.finalizedBy(copyLocaleFiles)
    configure.finalizedBy(copySDLJar)
    configure.finalizedBy(copyExtraMltFiles)
    configure.finalizedBy(removeDuplicateAssets)

    preBuild.dependsOn(configure)
    preBuild.dependsOn(copyLibs, copyMltPlugins, copyFonts, copyAssets, copyLocaleFiles, copySDLJar, copyExtraMltFiles, removeDuplicateAssets)
}

dependencies {
    implementation 'com.android.billingclient:billing:9.0.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation files("libs/SDL2Android.jar")
}
